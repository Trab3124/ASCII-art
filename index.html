<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASCII Motion Studio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #05070c;
      color: #d6e4f0;
      font-family: "Courier New", Courier, monospace;
      overflow: hidden;
    }

    .app {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
    }

    /* Zona superior: Render ASCII del video */
    .stage {
      position: relative;
      flex: 1.5;
      min-height: 60%;
      background: #05070c;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid rgba(110, 231, 183, 0.25);
      overflow: hidden;
    }

    #asciiCanvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
    }

    /* HUD superior con controles */
    .hud {
      position: absolute;
      top: 10px;
      left: 12px;
      right: 12px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      z-index: 10;
      pointer-events: none;
    }

    .hud-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      pointer-events: auto;
      background: rgba(7, 11, 20, 0.84);
      border: 1px solid rgba(110, 231, 183, 0.3);
      padding: 6px 10px;
      border-radius: 6px;
      backdrop-filter: blur(6px);
      font-size: 12px;
    }

    button, select, .file-btn {
      background: #0d1424;
      color: #6ee7b7;
      border: 1px solid rgba(110, 231, 183, 0.45);
      border-radius: 4px;
      padding: 4px 8px;
      font-family: inherit;
      font-size: 11.5px;
      cursor: pointer;
    }

    button:hover, select:hover, .file-btn:hover {
      background: #6ee7b7;
      color: #05070c;
    }

    input[type="file"] {
      display: none;
    }

    input[type="range"] {
      accent-color: #6ee7b7;
      width: 68px;
      cursor: pointer;
    }

    label.inline {
      display: flex;
      align-items: center;
      gap: 5px;
      color: #a7f3d0;
    }

    /* Mensaje central de inicio / estado */
    .overlay-msg {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(5, 7, 12, 0.82);
      text-align: center;
      padding: 20px;
      z-index: 5;
    }

    .overlay-msg.hidden {
      display: none;
    }

    .overlay-msg button {
      font-size: 14px;
      padding: 8px 16px;
    }

    /* Zona inferior: Consola de código + espectro de audio */
    .terminal {
      flex: 0.75;
      min-height: 26%;
      background: #080b13;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    .terminal-header {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #64748b;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 5px;
    }

    .terminal-body {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 14px;
      flex: 1;
      padding-top: 6px;
      overflow: hidden;
      font-size: 11.5px;
      line-height: 1.35;
    }

    #codeLines {
      color: #6ee7b7;
      white-space: pre;
      overflow: hidden;
    }

    .active-line {
      color: #ffffff;
      background: rgba(110, 231, 183, 0.14);
    }

    #audioSpectrum {
      color: #38bdf8;
      white-space: pre;
      overflow: hidden;
      border-left: 1px solid rgba(255, 255, 255, 0.08);
      padding-left: 12px;
    }

    video, audio {
      display: none;
    }

    @media (max-width: 720px) {
      .terminal-body {
        grid-template-columns: 1fr;
      }
      #audioSpectrum {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <main class="stage">
      <canvas id="asciiCanvas"></canvas>

      <div class="hud">
        <div class="hud-group">
          <select id="videoSelect" title="Videos del repositorio"></select>
          <select id="audioSelect" title="Pista de audio"></select>

          <label class="file-btn" title="Probar video desde tu dispositivo">
            + Video local
            <input type="file" id="localVideoInput" accept="video/*" />
          </label>

          <label class="file-btn" title="Probar audio desde tu dispositivo">
            + Audio local
            <input type="file" id="localAudioInput" accept="audio/*" />
          </label>
        </div>

        <div class="hud-group">
          <button id="playBtn">Pausar</button>
          <button id="muteBtn">Activar sonido</button>

          <select id="paletteSelect" title="Paleta ASCII">
            <option value="color" selected>Color Real</option>
            <option value="matrix">Verde Terminal</option>
            <option value="white">Blanco Puro</option>
            <option value="amber">Ámbar Retro</option>
          </select>

          <label class="inline" title="Detalle de caracteres">
            Detalle
            <input type="range" id="detailSlider" min="4" max="14" value="9" />
          </label>
        </div>
      </div>

      <div id="overlayMsg" class="overlay-msg">
        <p id="overlayText">Cargando catálogo ASCII...</p>
        <button id="startOverlayBtn" style="display:none;">Iniciar reproducción con audio</button>
      </div>
    </main>

    <section class="terminal">
      <div class="terminal-header">
        <span id="telemetryLeft">ENGINE: READY | GRID: 0x0</span>
        <span id="telemetryRight">FPS: 00 | FRAME #0</span>
      </div>
      <div class="terminal-body">
        <div id="codeLines"></div>
        <div id="audioSpectrum"></div>
      </div>
    </section>
  </div>

  <video id="videoEl" loop muted playsinline crossorigin="anonymous"></video>
  <audio id="audioEl" loop crossorigin="anonymous"></audio>

  <script>
    const videoEl = document.getElementById("videoEl");
    const audioEl = document.getElementById("audioEl");
    const canvas = document.getElementById("asciiCanvas");
    const ctx = canvas.getContext("2d");

    const offscreen = document.createElement("canvas");
    const offCtx = offscreen.getContext("2d", { willReadFrequently: true });

    const videoSelect = document.getElementById("videoSelect");
    const audioSelect = document.getElementById("audioSelect");
    const localVideoInput = document.getElementById("localVideoInput");
    const localAudioInput = document.getElementById("localAudioInput");
    const playBtn = document.getElementById("playBtn");
    const muteBtn = document.getElementById("muteBtn");
    const paletteSelect = document.getElementById("paletteSelect");
    const detailSlider = document.getElementById("detailSlider");

    const overlayMsg = document.getElementById("overlayMsg");
    const overlayText = document.getElementById("overlayText");
    const startOverlayBtn = document.getElementById("startOverlayBtn");

    const telemetryLeft = document.getElementById("telemetryLeft");
    const telemetryRight = document.getElementById("telemetryRight");
    const codeLinesEl = document.getElementById("codeLines");
    const audioSpectrumEl = document.getElementById("audioSpectrum");

    const CHARS = " .:-=+*#%@";
    const CHAR_ASPECT = 0.56;

    let cellSize = 18 - parseInt(detailSlider.value, 10);
    let frameCount = 0;
    let lastTime = performance.now();
    let fps = 60;
    let isMuted = true;

    // Web Audio API para analizar frecuencias en tiempo real
    let audioCtx = null;
    let analyser = null;
    let freqData = null;
    let videoSourceNode = null;
    let audioSourceNode = null;

    const ENGINE_CODE = [
      "const frame = captureVideoFrame(videoEl, cols, rows);",
      "const pixels = offCtx.getImageData(0, 0, cols, rows).data;",
      "for (let y = 0; y < rows; y++) {",
      "  for (let x = 0; x < cols; x++) {",
      "    const luma = (0.299*r + 0.587*g + 0.114*b) / 255;",
      "    const idx = Math.floor(contrast(luma) * (CHARS.length - 1));",
      "    drawGlyph(CHARS[idx], x * charW, y * cellSize, rgb);",
      "  }",
      "}",
      "syncAudioSpectrum(analyser, freqData);"
    ];

    function initAudioAnalyser() {
      if (audioCtx) {
        if (audioCtx.state === "suspended") audioCtx.resume();
        return;
      }
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return;

      audioCtx = new AudioContextClass();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 64;
      freqData = new Uint8Array(analyser.frequencyBinCount);

      try {
        videoSourceNode = audioCtx.createMediaElementSource(videoEl);
        videoSourceNode.connect(analyser);
      } catch (e) {}

      try {
        audioSourceNode = audioCtx.createMediaElementSource(audioEl);
        audioSourceNode.connect(analyser);
      } catch (e) {}

      analyser.connect(audioCtx.destination);
    }

    function applyAudioMode() {
      const mode = audioSelect.value;
      if (mode === "video") {
        audioEl.pause();
        videoEl.muted = isMuted;
        audioEl.muted = true;
      } else {
        videoEl.muted = true;
        audioEl.muted = isMuted;
        if (!videoEl.paused) {
          audioEl.play().catch(() => {});
        }
      }
      muteBtn.textContent = isMuted ? "Activar sonido" : "Silenciar";
    }

    function resizeCanvas() {
      const stageRect = canvas.parentElement.getBoundingClientRect();
      const vw = videoEl.videoWidth || 640;
      const vh = videoEl.videoHeight || 360;
      const ratio = vw / vh;

      let targetW = stageRect.width * 0.96;
      let targetH = targetW / ratio;

      if (targetH > stageRect.height * 0.92) {
        targetH = stageRect.height * 0.92;
        targetW = targetH * ratio;
      }

      canvas.width = Math.max(240, Math.floor(targetW));
      canvas.height = Math.max(160, Math.floor(targetH));
    }

    function updateTerminal(cols, rows, bassBoost) {
      const activeIdx = Math.floor(frameCount / 6) % ENGINE_CODE.length;
      codeLinesEl.innerHTML = ENGINE_CODE.map((line, i) => {
        const num = String(i + 1).padStart(2, "0");
        const cls = i === activeIdx ? ' class="active-line"' : "";
        return `<div${cls}>${i === activeIdx ? "▶" : " "} ${num} | ${line}</div>`;
      }).join("");

      if (analyser && freqData && !isMuted) {
        analyser.getByteFrequencyData(freqData);
        const bars = [];
        for (let i = 0; i < 10; i++) {
          const val = freqData[i] || 0;
          const len = Math.floor((val / 255) * 24);
          const bar = "█".repeat(len) + "░".repeat(24 - len);
          bars.push(`CH${String(i + 1).padStart(2, "0")} [${bar}] ${String(val).padStart(3, "0")}`);
        }
        audioSpectrumEl.textContent = bars.join("\n");
      } else {
        audioSpectrumEl.textContent =
          "AUDIO ANALYZER: STANDBY\n" +
          "Pulsa 'Activar sonido' para\n" +
          "sincronizar espectro en vivo.";
      }

      telemetryLeft.textContent = `GRID: ${cols}x${rows} | BASS: ${(bassBoost * 100).toFixed(0)}%`;
      telemetryRight.textContent = `FPS: ${String(fps).padStart(2, "0")} | FRAME #${frameCount}`;
    }

    function renderLoop(now) {
      const dt = (now - lastTime) / 1000;
      lastTime = now;

      if (!videoEl.paused && !videoEl.ended && videoEl.readyState >= 2) {
        frameCount++;
        if (frameCount % 10 === 0 && dt > 0) {
          fps = Math.min(60, Math.round(1 / dt));
        }

        let bassBoost = 0;
        if (analyser && freqData && !isMuted) {
          analyser.getByteFrequencyData(freqData);
          bassBoost = ((freqData[0] || 0) + (freqData[1] || 0) + (freqData[2] || 0)) / (3 * 255);
        }

        const effectiveCell = Math.max(4, cellSize - Math.round(bassBoost * 1.5));
        const cols = Math.floor(canvas.width / (effectiveCell * CHAR_ASPECT));
        const rows = Math.floor(canvas.height / effectiveCell);

        if (cols > 0 && rows > 0) {
          offscreen.width = cols;
          offscreen.height = rows;
          offCtx.drawImage(videoEl, 0, 0, cols, rows);

          const data = offCtx.getImageData(0, 0, cols, rows).data;

          ctx.fillStyle = "#05070c";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.font = `bold ${effectiveCell}px "Courier New", monospace`;
          ctx.textBaseline = "top";

          const palette = paletteSelect.value;
          if (palette === "matrix") ctx.fillStyle = "#6ee7b7";
          else if (palette === "white") ctx.fillStyle = "#f8fafc";
          else if (palette === "amber") ctx.fillStyle = "#fbbf24";

          const charW = effectiveCell * CHAR_ASPECT;

          for (let y = 0; y < rows; y++) {
            for (let x = 0; x < cols; x++) {
              const idx = (y * cols + x) * 4;
              const r = data[idx];
              const g = data[idx + 1];
              const b = data[idx + 2];

              let luma = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
              luma = Math.min(1, Math.max(0, (luma - 0.12) * 1.32 + bassBoost * 0.12));

              const charIndex = Math.floor(luma * (CHARS.length - 1));
              const glyph = CHARS[charIndex];

              if (glyph !== " ") {
                if (palette === "color") {
                  ctx.fillStyle = `rgb(${r},${g},${b})`;
                }
                ctx.fillText(glyph, x * charW, y * effectiveCell);
              }
            }
          }

          if (frameCount % 3 === 0) {
            updateTerminal(cols, rows, bassBoost);
          }
        }
      }

      requestAnimationFrame(renderLoop);
    }

    function loadVideoSource(src) {
      overlayMsg.classList.remove("hidden");
      overlayText.textContent = "Cargando video...";
      startOverlayBtn.style.display = "none";

      videoEl.src = src;
      videoEl.load();
    }

    videoEl.addEventListener("loadedmetadata", () => {
      resizeCanvas();
      videoEl.play()
        .then(() => {
          overlayMsg.classList.add("hidden");
          applyAudioMode();
        })
        .catch(() => {
          overlayText.textContent = "Listo para reproducir en ASCII";
          startOverlayBtn.style.display = "inline-block";
        });
    });

    videoEl.addEventListener("error", () => {
      overlayMsg.classList.remove("hidden");
      overlayText.textContent = "No se encontró el video en el repo. Sube un .mp4 o usa '+ Video local'.";
      startOverlayBtn.style.display = "none";
    });

    startOverlayBtn.addEventListener("click", () => {
      initAudioAnalyser();
      isMuted = false;
      videoEl.play();
      applyAudioMode();
      overlayMsg.classList.add("hidden");
    });

    playBtn.addEventListener("click", () => {
      initAudioAnalyser();
      if (videoEl.paused) {
        videoEl.play();
        if (audioSelect.value !== "video") audioEl.play().catch(() => {});
        playBtn.textContent = "Pausar";
      } else {
        videoEl.pause();
        audioEl.pause();
        playBtn.textContent = "Reanudar";
      }
    });

    muteBtn.addEventListener("click", () => {
      initAudioAnalyser();
      isMuted = !isMuted;
      applyAudioMode();
    });

    videoSelect.addEventListener("change", () => {
      loadVideoSource(videoSelect.value);
    });

    audioSelect.addEventListener("change", () => {
      initAudioAnalyser();
      const val = audioSelect.value;
      if (val !== "video") {
        audioEl.src = val;
        audioEl.load();
      }
      applyAudioMode();
    });

    localVideoInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      const opt = document.createElement("option");
      opt.value = url;
      opt.textContent = `Local: ${file.name}`;
      videoSelect.appendChild(opt);
      videoSelect.value = url;
      loadVideoSource(url);
    });

    localAudioInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      const opt = document.createElement("option");
      opt.value = url;
      opt.textContent = `Local: ${file.name}`;
      audioSelect.appendChild(opt);
      audioSelect.value = url;
      audioEl.src = url;
      audioEl.load();
      initAudioAnalyser();
      isMuted = false;
      applyAudioMode();
    });

    detailSlider.addEventListener("input", (e) => {
      cellSize = 18 - parseInt(e.target.value, 10);
    });

    window.addEventListener("resize", resizeCanvas);

    async function boot() {
      try {
        const res = await fetch(`playlist.json?v=${Date.now()}`);
        if (!res.ok) throw new Error("Sin playlist.json");
        const data = await res.json();

        (data.videos || []).forEach((v) => {
          const opt = document.createElement("option");
          opt.value = v.src;
          opt.textContent = v.title;
          videoSelect.appendChild(opt);
        });

        (data.audios || []).forEach((a) => {
          const opt = document.createElement("option");
          opt.value = a.src;
          opt.textContent = a.title;
          audioSelect.appendChild(opt);
        });

        if (videoSelect.options.length > 0) {
          loadVideoSource(videoSelect.value);
        } else {
          overlayText.textContent = "Agrega videos en playlist.json o usa '+ Video local'.";
        }
      } catch (err) {
        const defaultAudio = document.createElement("option");
        defaultAudio.value = "video";
        defaultAudio.textContent = "Audio original del video";
        audioSelect.appendChild(defaultAudio);

        overlayText.textContent = "Sube playlist.json y tus .mp4 a media/ o prueba con '+ Video local'.";
      }

      requestAnimationFrame(renderLoop);
    }

    boot();
  </script>
</body>
</html>
