<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASCII Procedural Scene — GitHub Pages</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #05070c;
      color: #d6e4f0;
      font-family: "Courier New", Courier, monospace;
      overflow: hidden;
    }

    .app {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
    }

    /* Zona superior: escena procedural en cuadrícula ASCII */
    .scene-panel {
      position: relative;
      flex: 1.35;
      min-height: 55%;
      background: #060911;
      border-bottom: 1px solid rgba(120, 180, 255, 0.22);
      overflow: hidden;
    }

    #sceneCanvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Barra superior flotante */
    .hud-bar {
      position: absolute;
      top: 10px;
      left: 12px;
      right: 12px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      pointer-events: none;
      font-size: 12px;
    }

    .hud-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      pointer-events: auto;
    }

    .badge, button, select {
      background: rgba(8, 13, 24, 0.85);
      color: #9be7ff;
      border: 1px solid rgba(155, 231, 255, 0.35);
      border-radius: 5px;
      padding: 4px 9px;
      font-family: inherit;
      font-size: 12px;
    }

    button, select {
      cursor: pointer;
    }

    button:hover, select:hover {
      background: #9be7ff;
      color: #05070c;
    }

    /* Zona inferior: código fuente desplazándose en tiempo real */
    .code-panel {
      flex: 0.9;
      min-height: 30%;
      background: #080b12;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .code-header {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #6f87a5;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      margin-bottom: 6px;
    }

    #codeStream {
      flex: 1;
      overflow: hidden;
      font-size: 11.5px;
      line-height: 1.38;
      color: #7ee787;
      white-space: pre;
    }

    .code-line-active {
      color: #ffffff;
      background: rgba(126, 231, 135, 0.12);
    }
  </style>
</head>
<body>
  <div class="app">
    <section class="scene-panel">
      <canvas id="sceneCanvas"></canvas>

      <div class="hud-bar">
        <div class="hud-group">
          <span class="badge" id="statusBadge">FPS: 00 | T: 00.0s</span>
          <span class="badge">GRID ASCII ENGINE</span>
        </div>

        <div class="hud-group">
          <select id="themeSelect" title="Estilo de escena">
            <option value="winter" selected>Escena Invernal + Trineo</option>
            <option value="cyber">Horizonte + Partículas</option>
          </select>
          <button id="toggleBtn">Pausar</button>
          <button id="burstBtn">Fuegos / Pulso</button>
        </div>
      </div>
    </section>

    <section class="code-panel">
      <div class="code-header">
        <span>scene_engine.js — render loop</span>
        <span id="frameCounter">FRAME #0</span>
      </div>
      <div id="codeStream"></div>
    </section>
  </div>

  <script>
    const canvas = document.getElementById("sceneCanvas");
    const ctx = canvas.getContext("2d");
    const statusBadge = document.getElementById("statusBadge");
    const frameCounter = document.getElementById("frameCounter");
    const codeStream = document.getElementById("codeStream");
    const themeSelect = document.getElementById("themeSelect");
    const toggleBtn = document.getElementById("toggleBtn");
    const burstBtn = document.getElementById("burstBtn");

    const CHAR_RAMP = " .:-=+*#%@";
    const CELL_W = 8;
    const CELL_H = 12;

    let cols = 0;
    let rows = 0;
    let running = true;
    let startTime = performance.now();
    let lastFrameTime = performance.now();
    let frameCount = 0;
    let fps = 60;

    // Partículas (chispas / fuegos artificiales / nieve)
    const particles = [];
    const snow = [];

    function resize() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = Math.max(320, Math.floor(rect.width));
      canvas.height = Math.max(200, Math.floor(rect.height));
      cols = Math.floor(canvas.width / CELL_W);
      rows = Math.floor(canvas.height / CELL_H);

      if (snow.length === 0) {
        for (let i = 0; i < 90; i++) {
          snow.push({
            x: Math.random() * cols,
            y: Math.random() * rows,
            vy: 0.18 + Math.random() * 0.45,
            vx: (Math.random() - 0.5) * 0.25,
            ch: Math.random() > 0.5 ? "*" : "."
          });
        }
      }
    }

    function spawnBurst(cx, cy, count = 36) {
      const palette = ["#ff5f56", "#ffbd2e", "#27c93f", "#58a6ff", "#f778ba", "#fff3b0"];
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.25;
        const speed = 0.25 + Math.random() * 0.95;
        particles.push({
          x: cx,
          y: cy,
          vx: Math.cos(angle) * speed * 1.4,
          vy: Math.sin(angle) * speed * 0.85,
          life: 1.0,
          decay: 0.015 + Math.random() * 0.02,
          color: palette[i % palette.length],
          ch: ["*", "+", "o", "#"][i % 4]
        });
      }
    }

    // Líneas de código mostradas en el panel inferior
    const SOURCE_LINES = [
      "function updateProceduralScene(t, cols, rows) {",
      "  const moonX = Math.floor(cols * 0.76);",
      "  const moonY = Math.floor(rows * 0.24);",
      "  drawLunarDisc(grid, moonX, moonY, radius = 6);",
      "  for (let x = 0; x < cols; x++) {",
      "    const hillY = Math.floor(rows * 0.72 + Math.sin(x * 0.06 + t * 0.4) * 3);",
      "    fillTerrain(grid, x, hillY, rows);",
      "  }",
      "  const sleighX = ((t * 11) % (cols + 26)) - 13;",
      "  const sleighY = Math.floor(rows * 0.42 + Math.sin(t * 2.4) * 2.2);",
      "  drawSleighAndReindeer(grid, sleighX, sleighY, t);",
      "  updateParticles(particles, dt);",
      "  renderAsciiMatrix(ctx, grid, charRamp);",
      "}"
    ];

    function renderCodePanel(tick) {
      const activeIdx = Math.floor(tick / 8) % SOURCE_LINES.length;
      const htmlLines = [];
      for (let i = 0; i < SOURCE_LINES.length; i++) {
        const lineNum = String(i + 1).padStart(2, "0");
        const isActive = i === activeIdx;
        const cls = isActive ? ' class="code-line-active"' : "";
        const marker = isActive ? "▶ " : "  ";
        htmlLines.push(`<div${cls}>${marker}${lineNum} | ${SOURCE_LINES[i]}</div>`);
      }
      codeStream.innerHTML = htmlLines.join("");
    }

    function drawChar(c, r, ch, color) {
      if (c < 0 || c >= cols || r < 0 || r >= rows) return;
      ctx.fillStyle = color;
      ctx.fillText(ch, c * CELL_W, r * CELL_H);
    }

    function drawSprite(startC, startR, spriteLines, color) {
      for (let dy = 0; dy < spriteLines.length; dy++) {
        const line = spriteLines[dy];
        for (let dx = 0; dx < line.length; dx++) {
          const ch = line[dx];
          if (ch !== " ") {
            drawChar(startC + dx, startR + dy, ch, color);
          }
        }
      }
    }

    function renderScene(now) {
      const dt = Math.min(0.05, (now - lastFrameTime) / 1000);
      lastFrameTime = now;
      const t = (now - startTime) / 1000;

      if (running) {
        frameCount++;
        if (frameCount % 10 === 0) {
          fps = Math.round(1 / Math.max(dt, 0.001));
        }

        ctx.fillStyle = "#060911";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.font = `bold ${CELL_H}px "Courier New", monospace`;
        ctx.textBaseline = "top";

        const isWinter = themeSelect.value === "winter";

        // 1. Estrellas de fondo
        for (let i = 0; i < 35; i++) {
          const sx = (i * 37) % Math.max(1, cols);
          const sy = (i * 19) % Math.max(1, Math.floor(rows * 0.55));
          const twinkle = Math.sin(t * 3 + i) > 0.3 ? "+" : ".";
          drawChar(sx, sy, twinkle, "#4c6380");
        }

        // 2. Luna / Astro superior derecha
        const moonC = Math.floor(cols * 0.78);
        const moonR = Math.max(4, Math.floor(rows * 0.22));
        const rad = Math.max(3, Math.min(6, Math.floor(Math.min(cols, rows) * 0.08)));

        for (let dr = -rad; dr <= rad; dr++) {
          for (let dc = -rad * 2; dc <= rad * 2; dc++) {
            const dist = Math.sqrt((dc / 2) ** 2 + dr ** 2);
            if (dist <= rad) {
              const isCrater = (dc === -2 && dr === -1) || (dc === 2 && dr === 1);
              const ch = isCrater ? "o" : dist > rad - 1.1 ? "%" : "@";
              drawChar(moonC + dc, moonR + dr, ch, isWinter ? "#fff3b0" : "#79c0ff");
            }
          }
        }

        // 3. Colinas y terreno inferior
        const horizonR = Math.floor(rows * 0.74);
        for (let c = 0; c < cols; c++) {
          const wave = Math.sin(c * 0.07 + t * 0.5) * 2.2 + Math.cos(c * 0.03 - t * 0.25) * 1.5;
          const topR = Math.floor(horizonR + wave);
          for (let r = topR; r < rows; r++) {
            const depthRatio = (r - topR) / Math.max(1, rows - topR);
            const idx = Math.min(CHAR_RAMP.length - 1, Math.floor(depthRatio * (CHAR_RAMP.length - 1)));
            const ch = r === topR ? "^" : CHAR_RAMP[idx];
            const col = isWinter
              ? (r === topR ? "#e6f1ff" : "#3a5a78")
              : (r === topR ? "#58a6ff" : "#1f3a52");
            drawChar(c, r, ch, col);
          }
        }

        // 4. Nieve / partículas ambientales
        for (const s of snow) {
          s.x += s.vx + Math.sin(t + s.y) * 0.08;
          s.y += s.vy;
          if (s.y >= rows) {
            s.y = 0;
            s.x = Math.random() * cols;
          }
          if (s.x < 0) s.x += cols;
          if (s.x >= cols) s.x -= cols;
          drawChar(Math.floor(s.x), Math.floor(s.y), s.ch, isWinter ? "#cde6ff" : "#58a6ff");
        }

        // 5. Elemento móvil principal (Trineo + Reno o Nave/Pulso)
        const span = cols + 34;
        const movingC = Math.floor(((t * 14) % span) - 17);
        const movingR = Math.max(3, Math.floor(rows * 0.42 + Math.sin(t * 2.6) * 2));

        const legFrame = Math.floor(t * 8) % 2 === 0 ? "/" : "\\";
        const sprite = isWinter
          ? [
              "        _.-''''-._       ",
              "      .'  (o)   ; '.     ",
              "  ___/_____________\\___  ",
              "  \\____[SANTA]_________/  ",
              `   '--/---\\---/---\\--'  ~${legFrame}`
            ]
          : [
              "      .---.      ",
              "   __/     \\__   ",
              "  (  [CORE]   )  ",
              `   '---v---v--' ~${legFrame}`
            ];

        drawSprite(movingC, movingR, sprite, isWinter ? "#ff7b72" : "#7ee787");

        // Fuegos artificiales automáticos ocasionales
        if (Math.random() < 0.035) {
          spawnBurst(
            Math.floor(cols * (0.2 + Math.random() * 0.6)),
            Math.max(3, Math.floor(rows * (0.15 + Math.random() * 0.3))),
            28
          );
        }

        // Actualizar y dibujar partículas de explosión
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.015;
          p.life -= p.decay;
          if (p.life <= 0) {
            particles.splice(i, 1);
            continue;
          }
          drawChar(Math.floor(p.x), Math.floor(p.y), p.ch, p.color);
        }

        // Título central superior estilo banner
        const banner = isWinter ? "=== ASCII MOTION ENGINE ===" : "=== LIVE GRID STREAM ===";
        const bannerC = Math.floor((cols - banner.length) / 2);
        drawSprite(bannerC, 2, [banner], "#f0f6fc");

        // HUD y código inferior
        statusBadge.textContent = `FPS: ${String(fps).padStart(2, "0")} | T: ${t.toFixed(1)}s`;
        frameCounter.textContent = `FRAME #${frameCount}`;
        renderCodePanel(frameCount);
      }

      requestAnimationFrame(renderScene);
    }

    window.addEventListener("resize", resize);
    toggleBtn.addEventListener("click", () => {
      running = !running;
      toggleBtn.textContent = running ? "Pausar" : "Reanudar";
      if (running) {
        lastFrameTime = performance.now();
      }
    });

    burstBtn.addEventListener("click", () => {
      spawnBurst(Math.floor(cols * 0.5), Math.max(4, Math.floor(rows * 0.28)), 48);
    });

    resize();
    requestAnimationFrame(renderScene);
  </script>
</body>
</html>
